<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Turnshare</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css" />
		<script defer src="/app.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
		<style>
			[x-cloak] { display: none !important; }
		</style>
	</head>
	<body>
		<main class="container" x-data="app" x-cloak>
			<hgroup>
				<h1>Turnshare</h1>
				<p x-text="role === 'sender' ? 'Send files peer-to-peer' : 'Receive files peer-to-peer'"></p>
			</hgroup>

			<template x-if="role === 'sender'">
				<article>
					<input type="file" multiple @change="pick" :disabled="link" aria-label="Files to send" />
					<ul x-show="files.length">
						<template x-for="file in files">
							<li><span x-text="file.name"></span> <small x-text="formatBytes(file.size)"></small></li>
						</template>
					</ul>
					<button x-show="!link" @click="share" :disabled="!files.length">Create link</button>
					<fieldset x-show="link" role="group">
						<input readonly :value="link" aria-label="Share link" @focus="$el.select()" />
						<button @click="copy" x-text="copied ? 'Copied' : 'Copy'"></button>
					</fieldset>
				</article>
			</template>

			<article x-show="status || error">
				<p x-show="error" x-text="error" role="alert"></p>
				<p x-show="!error" :aria-busy="busy" x-text="status" aria-live="polite"></p>
				<template x-if="total">
					<div>
						<progress :value="transferred" :max="total"></progress>
						<small>
							<span x-text="formatBytes(transferred)"></span> / <span x-text="formatBytes(total)"></span>
							<span x-show="route" x-text="'· ' + route"></span>
						</small>
					</div>
				</template>
			</article>

			<article x-show="downloads.length">
				<ul>
					<template x-for="file in downloads">
						<li>
							<a :href="file.url" :download="file.name" x-text="file.name"></a>
							<small x-text="formatBytes(file.size)"></small>
						</li>
					</template>
				</ul>
				<button x-show="done && downloads.length > 1" @click="downloadAll">Download all</button>
			</article>
		</main>
	</body>
</html>
